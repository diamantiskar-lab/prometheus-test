<meta charset="utf-8">

<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>
/* Mobile wrapper: same Unity build as the desktop link; 16:9 stage fitted to the phone screen in either orientation */
:root{
  --ink:#122a33; --verm:#db5b3a; --cream:#f7e7c6; --gold:#e8b44a; --track:rgba(247,231,198,.18);
  --body:"Commissioner",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--cream);font-family:var(--body);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;height:100dvh;display:block;
  padding:0;box-sizing:border-box}   /* v11: the whole screen, like the Unity template of the developers' demo */
#stage{position:relative;width:100%;height:100%;background:#000;overflow:hidden}
canvas{width:100%;height:100%;display:block;background:var(--ink);outline:none;touch-action:none}
#load{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;background:var(--verm);padding:0 16px}
#load h1{margin:0;font-weight:700;letter-spacing:.12em;font-size:clamp(15px,4.2vmin,30px);line-height:1.25}
#load h1 small{display:block;font-weight:500;font-size:.62em;letter-spacing:.14em;opacity:.85;margin-top:4px}
#load p{margin:0;font-size:clamp(11px,2.8vmin,15px);letter-spacing:.08em;opacity:.92}
.bar{width:min(70vw,420px);height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin:4px auto 0}
.bar i{display:block;height:100%;width:0;background:var(--cream);border-radius:99px;transition:width .3s}
#err{max-width:520px;margin:0 auto;background:var(--ink);border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.45;text-align:left}
#fs{position:fixed;z-index:5;display:flex;align-items:center;gap:8px;right:calc(8px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));
  background:rgba(18,42,51,.72);color:var(--cream);border:1px solid rgba(247,231,198,.4);border-radius:99px;
  padding:7px;font:600 12px var(--body);letter-spacing:.06em;cursor:pointer;transition:opacity .4s}
#fs svg{width:20px;height:20px;flex:none}
#fs span{display:none}
#fs[hidden]{display:none}
#fs.dim{opacity:.4}
body.portrait #fs{display:none}
#rot{position:fixed;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:99px;display:none;align-items:center;justify-content:center;
  background:rgba(18,42,51,.72);color:var(--cream);border:1px solid rgba(247,231,198,.4);pointer-events:none;animation:rotpulse 2s ease-in-out infinite}
#rot svg{width:44px;height:44px}
body.portrait #rot{display:flex}
@keyframes rotpulse{0%,100%{opacity:.12}50%{opacity:1}}

#fs:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="load">
    <h1>MEDEA<small>ΜΗΔΕΙΑ</small></h1>
    <p id="msg">LOADING · ΦΟΡΤΩΝΕΙ…</p>
    <div class="bar"><i id="pg"></i></div>
    <p id="pct">0%</p>
  </div>
</div></div>
<button id="fs" type="button" hidden aria-label="Full screen · Πλήρης οθόνη" title="Full screen · Πλήρης οθόνη"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>FULL SCREEN · ΠΛΗΡΗΣ ΟΘΟΝΗ</span></button>
<pre id="dbg" hidden style="position:fixed;left:6px;top:6px;max-width:90vw;max-height:40vh;overflow:auto;background:rgba(0,0,0,.8);color:#ffd28a;font:10px/1.35 ui-monospace,monospace;padding:6px;border-radius:6px;z-index:9;white-space:pre-wrap"></pre>
<script>
// v12.3: the first tap of the page (the language flag) must be heard. Phones accept a sound only from the END of a touch
// (touchend / pointerup / click), not from its start; v12.2 listened to the start, so the phone kept the sound off.
// Every AudioContext is woken up on the end of the touch, and a silent sample is played at once (iPhone needs it).
(() => { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; const all = [];
  class P extends A { constructor(...a) { super(...a); all.push(this); } }
  window.AudioContext = P; if (window.webkitAudioContext) window.webkitAudioContext = P;
  const wake = () => all.forEach(c => { if (c.state === 'running') return;
    try { const s = c.createBufferSource(); s.buffer = c.createBuffer(1, 1, 22050); s.connect(c.destination); s.start(0); } catch (e) {}
    c.resume().catch(() => {}); });
  ['touchstart', 'touchend', 'pointerdown', 'pointerup', 'mousedown', 'mouseup', 'click', 'keydown']
    .forEach(e => addEventListener(e, wake, { capture: true, passive: true })); })();
</script>
<script src="b/loader.js?v=1794387338"></script>
<script>
(() => {
  const dbg = document.getElementById('dbg');
  const DEBUG = /[?&#]debug/.test(location.href);
  const note = (k, a) => { if (!DEBUG) return; try { const s = Array.from(a).map(x => x && x.stack ? x.stack : String(x)).join(' ');
      if (/Permissions-Policy|AudioContext|unityweb|Content-Encoding/.test(s)) return;
      dbg.hidden = false; dbg.textContent = (k + ' ' + s.slice(0, 240) + '\n' + dbg.textContent).split('\n').slice(0, 30).join('\n'); } catch (e) {} };
  const oe = console.error.bind(console); console.error = function(){ note('ERR', arguments); oe.apply(null, arguments); };
  const ow = console.warn.bind(console); console.warn = function(){ note('WRN', arguments); ow.apply(null, arguments); };
  addEventListener('error', e => note('ERR', [e.message + ' @' + e.filename + ':' + e.lineno]));
  addEventListener('unhandledrejection', e => note('REJ', [e.reason]));

  const BUILD = '1794387338';
  const M = {"code": {"parts": ["b/code_00.wasm"], "gz": 12930275}, "data": {"parts": ["b/data_00.wasm", "b/data_01.wasm", "b/data_02.wasm", "b/data_03.wasm", "b/data_04.wasm", "b/data_05.wasm", "b/data_06.wasm"], "gz": 92999614}};

  // Fit a 16:9 stage into the visible area (safe areas excluded) in either orientation
  const stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
  function fit(){
    const r = wrap.getBoundingClientRect(), cs = getComputedStyle(wrap);
    const W = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const H = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    // Fill the whole screen, like the original Unity template: the app adapts itself to any aspect, portrait or landscape
    const w = W;
    // v11.1: the size comes from CSS only (100% of the screen), like the developers' Unity template, so a turn of the
    // phone never leaves the app with the size of the other orientation
    document.body.classList.toggle('portrait', H > W);
    const side = (W - w) / 2, b = document.getElementById('fs');
    if (b){ const roomy = side >= 46; b.style.right = roomy ? 'calc(' + Math.round((side - 36) / 2) + 'px + env(safe-area-inset-right,0px))' : '';
      clearTimeout(fit.t); b.classList.remove('dim'); if (!roomy) fit.t = setTimeout(() => b.classList.add('dim'), 4000); }
  }
  addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250));
  if (window.visualViewport) visualViewport.addEventListener('resize', fit);
  fit();

  // Full screen only where the browser really supports it (Android Chrome); iPhone Safari has no element full screen
  const de = document.documentElement, fsBtn = document.getElementById('fs');
  const reqFS = de.requestFullscreen || de.webkitRequestFullscreen;
  const fsOK = false;   // v11: no full-screen button (it covered the microphone button; the developers' demo has none on phones)
  const inFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  function syncFS(){ fsBtn.hidden = !fsOK || inFS(); setTimeout(fit, 200); }
  fsBtn.onclick = async () => {
    try { await reqFS.call(de, { navigationUI: 'hide' }); } catch (e) { fsBtn.hidden = true; return; }
    try { await screen.orientation.lock('landscape'); } catch (e) {}
  };
  document.addEventListener('fullscreenchange', syncFS); document.addEventListener('webkitfullscreenchange', syncFS);
  syncFS();
  document.addEventListener('gesturestart', e => e.preventDefault());

  const pg = document.getElementById('pg'), pct = document.getElementById('pct'), msg = document.getElementById('msg');
  const total = M.code.gz + M.data.gz; let got = 0;
  const show = (f) => { pg.style.width = (f * 100).toFixed(1) + '%'; pct.textContent = Math.round(f * 100) + '%'; };

  // Stream the parts straight into the gzip decoder, so the compressed copy is never held in memory (phones have little)
  async function fetchParts(entry, type){
    let i = 0, reader = null;
    const src = new ReadableStream({
      async pull(ctrl){
        for(;;){
          if (!reader){
            if (i >= entry.parts.length){ ctrl.close(); return; }
            const p = entry.parts[i++], r = await fetch(p + '?v=' + BUILD);
            if (!r.ok) throw new Error('Could not load ' + p + ' (' + r.status + ')');
            reader = r.body.getReader();
          }
          const { done, value } = await reader.read();
          if (done){ reader = null; continue; }
          got += value.length; show(.8 * got / total); ctrl.enqueue(value); return;
        }
      }
    });
    const raw = await new Response(src.pipeThrough(new DecompressionStream('gzip'))).blob();
    return URL.createObjectURL(new Blob([raw], { type }));
  }

  function fail(e){
    msg.textContent = 'THE APP COULD NOT START · Η ΕΦΑΡΜΟΓΗ ΔΕΝ ΞΕΚΙΝΗΣΕ';
    const d = document.createElement('div'); d.id = 'err'; d.textContent = String(e && e.message || e);
    document.getElementById('load').appendChild(d);
  }

  (async () => {
    try {
      const codeUrl = await fetchParts(M.code, 'application/wasm');
      const dataUrl = await fetchParts(M.data, 'application/octet-stream');
      msg.textContent = 'STARTING · ΞΕΚΙΝΑ…';
      const canvas = document.getElementById('unity-canvas');
      const inst = await createUnityInstance(canvas, {
        dataUrl, frameworkUrl: 'b/framework.js?v=' + BUILD, codeUrl,
        streamingAssetsUrl: 'StreamingAssets',
        companyName: 'Birigogo', productName: 'Μήδεια', productVersion: 'demo',
        devicePixelRatio: window.devicePixelRatio || 1,   // v11: full screen resolution (sharp text), like the developers' demo
        showBanner: (m, type) => { if (type === 'error') console.error(m); else console.warn(m); }
      }, (p) => show(.8 + .2 * p));
      setTimeout(() => { URL.revokeObjectURL(codeUrl); URL.revokeObjectURL(dataUrl); }, 15000);
      document.getElementById('load').remove();
    } catch (e) { fail(e); }
  })();
})();
</script>
